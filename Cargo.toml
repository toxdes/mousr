[package]
name = "mousr"
version = "0.1.7"
edition = "2024"
autobins = false
license = "MIT"
description = "Keyboard-driven mouse control for Wayland"
repository = "https://github.com/toxdes/mousr"
readme = "README.md"
keywords = ["wayland", "mouse", "keyboard", "sway", "accessibility"]
categories = ["command-line-utilities", "accessibility"]

[[bin]]
name = "mousr"
path = "src/main.rs"

[dependencies]
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
libc = "0.2"
fontdue = "0.9.3"
log = { version = "0.4.22", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = ["calloop", "xkbcommon"] }
thiserror = "2.0.20"
tiny-skia = "0.11.4"
toml = "0.9.12"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
