[project]
id = "mousr"
name = "Mousr"
version_file = "VERSION"
description = "Keyboard-driven mouse control for Wayland"
homepage = "https://github.com/toxdes/mousr"
repository = "https://github.com/toxdes/mousr"
license = "MIT"
maintainer = "toxdes <hi@toxdes.com>"

[build]
dockerfile = "Dockerfile"
context = "."
output_dir = "dist"
platforms = ["linux/amd64", "linux/arm64"]

[build.args]
BUILD = "release"
INCLUDE_APPIMAGE = "0"

[artifacts]
deb = ["*.deb"]
rpm = ["*.rpm"]
archive = ["*.tar.gz"]

[package]
binary = "mousr"

[deb]
helper_image = "docker.io/toxdes/yesb-apt-helper@sha256:ec2452ba31dcec97924f061352ed84626ee890d3b88f33bddf6eb22fe8eb635f"
package_name = "mousr"
section = "utils"
priority = "optional"
architectures = ["amd64", "arm64"]
depends = [
  "libwayland-client0",
  "libxkbcommon0",
]

[rpm]
helper_image = "docker.io/toxdes/yesb-rpm-helper@sha256:ee8caaff1fd1434b1414e09b5fce00572d3199b622f6ba39f73a3934117e221c"
package_name = "mousr"
release = "1"
architectures = ["x86_64", "aarch64"]
requires = [
  "wayland-libs",
  "libxkbcommon",
]

[aur]
binary_package = "mousr-bin"
git_package = "mousr-git"
srcinfo_helper_image = "docker.io/toxdes/yesb-aur-helper@sha256:e0b511b58baf4d1e281b154a50fd15125f886472dc7166a4aa578cb7a40435ea"
architectures = ["x86_64", "aarch64"]
depends = [
  "wayland",
  "libxkbcommon",
]
source_pkgbuild = "PKGBUILD.source"
git_pkgbuild = "PKGBUILD"

[hosting]
public_base_url = "https://packages.toxdes.com"
apt_prefix = "apt"
rpm_prefix = "rpm"
release_prefix = "releases"

[hosting.apt]
suite = "stable"
component = "main"
origin = "toxdes"
label = "Toxdes"

[hosting.signing]
gpg_key_env = "GPG_KEY_ID"
gpg_passphrase_env = "GPG_PASSPHRASE"

[hosting.aur]
host = "aur.archlinux.org"
ssh_user = "aur"
maintainer = "toxdes <hi@toxdes.com>"
