[general]
scope = "focused"
require_shortcut_inhibit = true

[grid]
min_tile_width = 24
min_tile_height = 24
max_label_length = 2
max_depth = 2
max_cells = 4096
auto_descend = false
unmatched = "dim" # keep, dim, or hide
unmatched_opacity = 0.18

[motion]
initial_speed = 60.0
acceleration = 1400.0
max_speed = 1800.0
tick_hz = 120
curve = "ease-in-out" # linear, ease-in, ease-out, or ease-in-out

[scroll]
vertical_step = 15.0
horizontal_step = 15.0

[bindings.grid]
left_click = "s"
middle_click = "d"
right_click = "f"
scroll_up = "u"
scroll_down = "e"
scroll_left = "y"
scroll_right = "o"
enter_mouse = "g"
move_only = "space"
descend = "Return"
back = "BackSpace"
cancel = "Escape"

[bindings.mouse]
left = "h"
down = "j"
up = "k"
right = "l"
left_button = "s"
middle_button = "d"
right_button = "f"
button_lock = "v"
scroll_up = "u"
scroll_down = "e"
scroll_left = "y"
scroll_right = "o"
cancel = "Escape"

[ui]
# font_path = "/path/to/font.ttf"
font_size = 14.0
overlay_background = "#02061759"
cell_background = "#1e293b26"
grid_border = "#cbd5e199"
grid_border_width = 1.0
label_background = "#0f172a80"
label_foreground = "#f8fafcff"
matched_background = "#f59e0bcc"
matched_foreground = "#1c1917ff"
selected_background = "#22c55e38"
selected_border = "#86efacff"
selected_border_width = 2.0
badge_background = "#0f172ad9"
badge_foreground = "#f8fafcff"
badge_border = "#f59e0bff"
badge_border_width = 1.0
target_ring = "#f59e0bff"
target_ring_width = 2.5
target_ring_radius = 16.0
show_badge = true
show_target_ring = true
show_action_hints = true
